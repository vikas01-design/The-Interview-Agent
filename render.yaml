services:
  # ----------------------------------------------------
  # FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: the-interview-agent-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # React Vite Static Frontend Site
  # ----------------------------------------------------
  - type: web
    name: the-interview-agent-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: pk_test_Zmx5aW5nLWxlbXVyLTY2LmNsZXJrLmFjY291bnRzLmRldiQ
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: the-interview-agent-api
          property: url
